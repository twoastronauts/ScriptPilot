name: Build Installers

on:
  push:
    branches:
      - main
      - master
      - codex/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            command: npm run dist:win
            artifact: Script-Pilot-V02-Windows
          - name: macOS
            os: macos-latest
            command: npm run dist:mac
            artifact: Script-Pilot-V02-Mac

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm run test

      - name: Generate macOS icon
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          ICONSET="src/assets/script-pilot-icon.iconset"
          mkdir -p "$ICONSET"
          sips -z 16 16 src/assets/script-pilot-icon.png --out "$ICONSET/icon_16x16.png"
          sips -z 32 32 src/assets/script-pilot-icon.png --out "$ICONSET/icon_16x16@2x.png"
          sips -z 32 32 src/assets/script-pilot-icon.png --out "$ICONSET/icon_32x32.png"
          sips -z 64 64 src/assets/script-pilot-icon.png --out "$ICONSET/icon_32x32@2x.png"
          sips -z 128 128 src/assets/script-pilot-icon.png --out "$ICONSET/icon_128x128.png"
          sips -z 256 256 src/assets/script-pilot-icon.png --out "$ICONSET/icon_128x128@2x.png"
          sips -z 256 256 src/assets/script-pilot-icon.png --out "$ICONSET/icon_256x256.png"
          sips -z 512 512 src/assets/script-pilot-icon.png --out "$ICONSET/icon_256x256@2x.png"
          sips -z 512 512 src/assets/script-pilot-icon.png --out "$ICONSET/icon_512x512.png"
          sips -z 1024 1024 src/assets/script-pilot-icon.png --out "$ICONSET/icon_512x512@2x.png"
          iconutil -c icns "$ICONSET" -o src/assets/script-pilot-icon.icns

      - name: Package
        run: ${{ matrix.command }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip

  publish-release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v0.2.0
      RELEASE_TITLE: Script Pilot V02 0.2.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-upload
          cp release-artifacts/Script-Pilot-V02-0.2.0-x64.exe release-upload/Script-Pilot-V02-0.2.0-Windows-x64.exe
          cp release-artifacts/Script-Pilot-V02-0.2.0-universal.dmg release-upload/Script-Pilot-V02-0.2.0-macOS-universal.dmg
          cat > release-notes.md <<'NOTES'
          Latest Script Pilot V02 installer refresh.

          Assets:
          - Script-Pilot-V02-0.2.0-Windows-x64.exe
          - Script-Pilot-V02-0.2.0-macOS-universal.dmg

          The macOS build is unsigned/unnotarized until Apple signing credentials are added.
          NOTES

      - name: Create or update release
        shell: bash
        run: |
          set -euo pipefail
          git tag -f "$RELEASE_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$RELEASE_TAG" --force
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-upload/* --clobber
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TITLE" --notes-file release-notes.md --latest
          else
            gh release create "$RELEASE_TAG" release-upload/* --title "$RELEASE_TITLE" --notes-file release-notes.md --latest
          fi
