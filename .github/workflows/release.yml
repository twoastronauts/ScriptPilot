name: Build Installers

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            command: npm run dist:win
            artifact: Script-Pilot-Windows
          - name: macOS
            os: macos-latest
            command: npm run dist:mac
            artifact: Script-Pilot-Mac

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm run test

      - name: Generate macOS icon
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          ICONSET="src/assets/script-pilot-icon.iconset"
          mkdir -p "$ICONSET"
          sips -z 16 16 src/assets/script-pilot-icon.png --out "$ICONSET/icon_16x16.png"
          sips -z 32 32 src/assets/script-pilot-icon.png --out "$ICONSET/icon_16x16@2x.png"
          sips -z 32 32 src/assets/script-pilot-icon.png --out "$ICONSET/icon_32x32.png"
          sips -z 64 64 src/assets/script-pilot-icon.png --out "$ICONSET/icon_32x32@2x.png"
          sips -z 128 128 src/assets/script-pilot-icon.png --out "$ICONSET/icon_128x128.png"
          sips -z 256 256 src/assets/script-pilot-icon.png --out "$ICONSET/icon_128x128@2x.png"
          sips -z 256 256 src/assets/script-pilot-icon.png --out "$ICONSET/icon_256x256.png"
          sips -z 512 512 src/assets/script-pilot-icon.png --out "$ICONSET/icon_256x256@2x.png"
          sips -z 512 512 src/assets/script-pilot-icon.png --out "$ICONSET/icon_512x512.png"
          sips -z 1024 1024 src/assets/script-pilot-icon.png --out "$ICONSET/icon_512x512@2x.png"
          iconutil -c icns "$ICONSET" -o src/assets/script-pilot-icon.icns

      - name: Package
        run: ${{ matrix.command }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
